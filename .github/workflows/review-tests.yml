name: Review engine checks
on:
  push:
    paths: ['audit-core.js', 'gen-data.json', 'test-core.cjs', '.github/workflows/review-tests.yml']
  pull_request:
jobs:
  review-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test-core.cjs
      - run: node --check audit-ui.js
